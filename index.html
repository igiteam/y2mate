<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Video Downloader - Y2Mate</title>
  <meta name="description" content="Y2Mate is a safe, ad-free YouTube video downloader for MP3 audio and MP4 video. Fast online conversion, no registration needed.">
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { min-height: 100%; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 300;
      margin: 0 auto;
      padding: 0 14px 54px;
      color: var(--page-text);
      background: radial-gradient(1200px 700px at 12% 2%, rgba(236, 72, 153, .16), transparent 58%),
                  radial-gradient(900px 600px at 88% 10%, rgba(147, 51, 234, .16), transparent 55%),
                  radial-gradient(1200px 700px at 50% 110%, rgba(17, 24, 39, .10), transparent 60%),
                  #f7f3fb;
      background-attachment: scroll;
      overflow-x: hidden;
      transition: background .3s ease, color .3s ease;
    }

    /* ===== CSS VARIABLES (LIGHT DEFAULT) ===== */
    :root {
      --rn-bg: #070A0F;
      --rn-text: rgba(255, 255, 255, .92);
      --rn-muted: rgba(255, 255, 255, .68);
      --rn-muted-2: rgba(255, 255, 255, .55);
      --rn-border: rgba(255, 255, 255, .12);
      --rn-border-soft: rgba(255, 255, 255, .06);
      --rn-panel: rgba(255, 255, 255, .06);
      --rn-panel-strong: rgba(255, 255, 255, .1);
      --rn-accent-a: #ef4444;
      --rn-accent-b: #22c55e;
      --rn-shadow: 0 24px 80px rgba(0, 0, 0, .58);
      --rn-shadow-soft: 0 14px 40px rgba(0, 0, 0, .45);
      --rn-radius: 8px;
      --rn-radius-sm: 8px;
      --rn-max: 1160px;

      --page-text: #0f172a;
      --page-muted: rgba(15, 23, 42, .78);
      --page-muted-2: rgba(15, 23, 42, .62);
      --page-border: rgba(15, 23, 42, .14);
      --page-border-soft: rgba(15, 23, 42, .1);
      --page-panel: rgba(255, 255, 255, .84);
      --page-panel-strong: rgba(255, 255, 255, .96);
      --page-input: #ffffff;
      --page-link: #111827;
      --page-link-hover: #16a34a;
      --page-button-text: #ffffff;
      --page-button-shadow: 0 18px 60px rgba(34, 197, 94, .18);
    }

    body.dark-mode {
      --page-text: var(--rn-text);
      --page-muted: var(--rn-muted);
      --page-muted-2: var(--rn-muted-2);
      --page-border: var(--rn-border);
      --page-border-soft: var(--rn-border-soft);
      --page-panel: var(--rn-panel);
      --page-panel-strong: var(--rn-panel-strong);
      --page-input: rgba(255, 255, 255, .04);
      --page-link: rgba(255, 255, 255, .92);
      --page-link-hover: #ffffff;
      --page-button-text: #ffffff;
      --page-button-shadow: 0 18px 60px rgba(34, 197, 94, .22);
      background: radial-gradient(1200px 700px at 15% 0%, rgba(236, 72, 153, .24), transparent 58%),
                  radial-gradient(900px 600px at 85% 12%, rgba(147, 51, 234, .28), transparent 55%),
                  radial-gradient(1200px 700px at 45% 110%, rgba(17, 24, 39, .72), transparent 60%),
                  #07070f;
    }

    /* ===== TYPOGRAPHY ===== */
    h1, h2, h3, h4 {
      color: var(--page-text);
      font-weight: 700;
      letter-spacing: 0;
    }
    p, li, label, time { color: var(--page-muted); }
    a {
      color: var(--page-link);
      text-decoration: none;
      transition: color .15s ease, transform .15s ease, opacity .15s ease, border-color .15s ease, background .15s ease;
    }
    a:hover { color: var(--page-link-hover); }

    /* ===== HEADER ===== */
    body > header {
      width: min(var(--rn-max), calc(100% - 8px));
      min-height: auto;
      margin: 24px auto 0;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border: 1px solid var(--page-border-soft);
      border-radius: var(--rn-radius);
      background: linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .03));
      box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
      text-align: left;
    }
    body > header > a {
      display: inline-flex;
      align-items: center;
      min-width: fit-content;
    }
    #logo {
      width: 200px;
      height: auto;
      display: block;
    }
    body:not(.dark-mode) #logo { filter: none; }

    .menu {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 14px;
    }
    header .menu a, header .menu p, footer .menu a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: auto;
      padding: 6px 2px;
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--page-text);
      font-weight: 650;
      line-height: 1;
      white-space: nowrap;
      opacity: .94;
      cursor: pointer;
    }
    header .menu a:hover, header .menu p:hover, footer .menu a:hover {
      transform: none;
      border-color: transparent;
      background: transparent;
      color: var(--page-text);
      opacity: 1;
    }
    #darkModeSwitch { cursor: pointer; margin: 0; }

    /* ===== MAIN CARD ===== */
    #main, #contact-form, .contact-form {
      width: min(var(--rn-max), 100%);
      margin-left: auto;
      margin-right: auto;
      border: 1px solid var(--page-border-soft);
      background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .03));
      box-shadow: 0 10px 28px rgba(0, 0, 0, .18);
    }
    body:not(.dark-mode) #main {
      background: linear-gradient(180deg, rgba(255, 255, 255, .92), rgba(248, 250, 252, .94));
      box-shadow: 0 22px 56px rgba(15, 23, 42, .08);
    }
    #main {
      max-width: 980px;
      margin-top: 26px;
      margin-bottom: 26px;
      padding: 52px 32px 36px;
      border-radius: 8px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, .22);
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 3;
      overflow: visible;
    }
    #main h1#title {
      height: auto;
      margin: 18px 0 14px;
      font-size: 2rem;
      line-height: 1.02;
      text-align: center;
    }
    #main .tagline {
      display: block;
      margin: 0 auto 24px;
      padding: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--page-muted);
      font-size: 1.2rem;
      line-height: 1.55;
      letter-spacing: .01em;
      max-width: 860px;
      text-align: center;
    }

    /* ===== FORM ===== */
    #main #form {
      position: relative;
      width: min(100%, 820px);
      height: auto;
      margin: 34px auto 28px;
      padding: 12px 0 0;
      border: none;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      display: grid;
      align-items: stretch;
      min-height: 330px;
      gap: 0;
      overflow: visible;
      justify-content: center;
    }

    .form-state {
      grid-area: 1 / 1;
      width: 100%;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
    }
    .form-state.is-active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: none;
    }

    #form-idle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    #url, .form-control, input[type="text"], input[type="email"], textarea, select {
      width: 100%;
      border: 1px solid var(--page-border-soft);
      border-radius: 18px;
      background: rgba(255, 255, 255, .06);
      color: var(--page-text);
      font-family: inherit;
      font-size: 15px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .03);
    }
    #url {
      width: min(100%, 680px);
      min-height: 58px;
      padding: 18px 20px;
    }
    #url::placeholder, .form-control::placeholder, textarea::placeholder {
      color: var(--page-muted);
    }
    body:not(.dark-mode) #url, body:not(.dark-mode) .form-control,
    body:not(.dark-mode) input[type="text"], body:not(.dark-mode) input[type="email"],
    body:not(.dark-mode) textarea, body:not(.dark-mode) select,
    body:not(.dark-mode) #format, body:not(.dark-mode) #mp3-quality,
    body:not(.dark-mode) #mp4-quality {
      border-color: rgba(15, 23, 42, .12);
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .03), inset 0 1px 0 rgba(255, 255, 255, .95);
    }
    body.dark-mode #url, body.dark-mode .form-control, body.dark-mode input[type="text"],
    body.dark-mode input[type="email"], body.dark-mode textarea, body.dark-mode select,
    body.dark-mode #format, body.dark-mode #mp3-quality, body.dark-mode #mp4-quality {
      background: var(--page-input);
      color: var(--page-text);
      border-color: var(--page-border-soft);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }
    #url:focus, .form-control:focus, input[type="text"]:focus,
    input[type="email"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: rgba(34, 197, 94, .45);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, .12);
    }

    #quality-selector {
      width: min(100%, 760px);
      min-height: 0;
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 22px;
      flex-wrap: wrap;
      margin-bottom: 0;
    }
    #quality-selector > div {
      flex: 1 1 280px;
      min-width: 240px;
      max-width: 340px;
      padding: 0;
      border: none;
      border-radius: 0;
      background: transparent;
    }
    #quality-selector p {
      margin: 0 0 8px;
      color: var(--page-muted);
      font-size: 13px;
      text-align: left;
      font-weight: 500;
    }
    body:not(.dark-mode) #quality-selector p { color: rgba(15, 23, 42, .72); }

    #format, #mp3-quality, #mp4-quality {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      border-radius: 16px;
    }

    /* ===== BUTTONS ===== */
    #download-button, #home-button, #convert-button, #donate-button, #trim-button,
    .btn-dark, input[type="submit"].btn, input[type="submit"].btn-dark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 14px 22px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(236, 72, 153, .96), rgba(147, 51, 234, .94) 52%, rgba(255, 43, 92, 0.98));
      color: var(--page-button-text);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      box-shadow: 0 8px 18px rgba(147, 51, 234, .18);
      cursor: pointer;
      border: none;
      transition: opacity .2s ease, transform .15s ease;
    }
    #download-button:hover, #home-button:hover, #convert-button:hover,
    #donate-button:hover, #trim-button:hover, .btn-dark:hover,
    input[type="submit"].btn:hover, input[type="submit"].btn-dark:hover {
      opacity: .92;
      transform: translateY(-1px);
    }
    #home-button {
      border-color: var(--page-border);
      background: rgba(255, 255, 255, .05);
      box-shadow: none;
    }
    #convert-button {
      font-size: 16px;
      width: auto;
      min-width: 160px;
    }

    /* ===== LOADING & RESULT ===== */
    #form-loading, #form-result {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 12px 0;
      text-align: center;
    }
    #status-text { color: var(--page-muted); font-size: 0.98rem; margin: 0; }
    .progress-message { color: var(--page-text); font-size: 1.05rem; font-weight: 650; margin: 0; }

    .loading-spinner {
      border: 4px solid rgba(255, 255, 255, .5);
      border-radius: 50%;
      border-top: 4px solid #000;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #result-actions {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    /* ===== FOOTER ===== */
    footer {
      width: min(var(--rn-max), calc(100% - 8px));
      margin: 0 auto;
      padding: 6px 0 0;
    }
    footer .menu {
      justify-content: center;
      gap: 28px;
    }
    body:not(.dark-mode) footer .menu a,
    body:not(.dark-mode) footer .menu a:hover {
      color: #0f172a;
    }
    body.dark-mode footer .menu a,
    body.dark-mode footer .menu a:hover {
      color: var(--page-text);
    }

    /* ===== UTILITY ===== */
    .d-none { display: none !important; }
    .d-block { display: block !important; }

    /* ===== RESPONSIVE ===== */
    @media only screen and (max-width: 980px) {
      body > header { width: calc(100% - 8px); }
      #main, #contact-form, .message { width: 100%; }
    }

    @media only screen and (max-width: 780px) {
      body { padding: 0 10px 38px; background: linear-gradient(180deg, rgba(147, 51, 234, .18), rgba(17, 24, 39, .08)), #07070f; }
      body:not(.dark-mode) { background: radial-gradient(1200px 700px at 12% 2%, rgba(236, 72, 153, .16), transparent 58%), radial-gradient(900px 600px at 88% 10%, rgba(147, 51, 234, .16), transparent 55%), radial-gradient(1200px 700px at 50% 110%, rgba(17, 24, 39, .10), transparent 60%), #f7f3fb; }
      body > header {
        flex-direction: column;
        align-items: stretch;
        padding: 16px;
        text-align: center;
      }
      body > header > a { justify-content: center; }
      .menu { justify-content: center; }
      header .menu a, header .menu p, footer .menu a { flex: 0 0 auto; }
      #main { padding: 38px 18px 24px; border-radius: 8px; }
      #main h1#title { font-size: 1.75rem; }
      #main .tagline { font-size: 1rem; line-height: 1.55; }
      #main #form { max-width: 100%; padding: 8px 0 0; margin-block: 24px; border-radius: 0; min-height: 360px; gap: 16px; }
      #form-idle { width: 90vw; gap: 16px; }
      #form-idle #url, #main #form #url {
        width: 90% !important;
        max-width: 90% !important;
        margin-inline: auto !important;
        align-self: center;
        min-height: 50px;
        padding: 20px 18px !important;
        font-size: 17px !important;
      }
      #quality-selector { gap: 12px; align-items: flex-end; }
      #quality-selector > div {
        min-width: 0;
        max-width: none;
        width: calc(50% - 6px);
        flex: 1 1 calc(50% - 6px);
      }
      #quality-selector > div:first-child { width: calc(42% - 6px); flex: 0 1 calc(42% - 6px); }
      #quality-selector > div:last-child { width: calc(58% - 6px); flex: 1 1 calc(58% - 6px); }
      #quality-selector p { margin-bottom: 6px; }
      #convert-button { min-height: 50px; width: 100%; }
      #form-result { align-items: stretch; }
      #result-actions { gap: 12px; }
      #result-actions > * { width: 100%; }
      #download-button, #home-button, #convert-button, #donate-button, #trim-button,
      .btn-dark, input[type="submit"].btn, input[type="submit"].btn-dark { width: 100%; }
      body > header, #main, #contact-form, .contact-form, .message { box-shadow: none !important; }
    }

    @media only screen and (max-width: 520px) {
      #main #form { min-height: 340px; }
      #quality-selector { gap: 10px; }
      #quality-selector > div { width: calc(50% - 5px); flex: 1 1 calc(50% - 5px); }
      #form-idle #url, #main #form #url {
        width: 92% !important;
        max-width: 92% !important;
        margin-inline: auto !important;
        min-height: 50px;
        padding: 22px 18px !important;
        font-size: 18px !important;
      }
      #quality-selector > div:first-child { width: calc(40% - 5px); flex: 0 1 calc(40% - 5px); }
      #quality-selector > div:last-child { width: calc(60% - 5px); flex: 1 1 calc(60% - 5px); }
    }
  </style>
</head>
<body class="dark-mode">

  <!-- ===== MAIN ===== -->
  <div id="main">
    <h1 id="title">YouTube Video Downloader</h1>
    <p class="tagline">100% safe, Ad-free YouTube to MP3 and MP4 converter</p>

    <div data-state="idle" id="form">
      <!-- IDLE STATE -->
      <div class="form-state is-active" id="form-idle">
        <input autocapitalize="none" autocomplete="off" id="url" inputmode="url" placeholder="Paste YouTube URL..." spellcheck="false" type="url">

  <!-- ===== JAVASCRIPT ===== -->
  <script>
    (function() {
      'use strict';

      // ---- DOM refs ----
      var darkModeSwitch = document.getElementById('darkModeSwitch');
      var formatSelect = document.getElementById('format');
      var mp3Div = document.getElementById('mp3');
      var mp4Div = document.getElementById('mp4');
      var mp3Quality = document.getElementById('mp3-quality');
      var mp4Quality = document.getElementById('mp4-quality');
      var convertButton = document.getElementById('convert-button');
      var urlInput = document.getElementById('url');
      var formIdle = document.getElementById('form-idle');
      var formLoading = document.getElementById('form-loading');
      var formResult = document.getElementById('form-result');
      var statusText = document.getElementById('status-text');
      var progressText = document.getElementById('progress');

      // ---- Dark mode toggle ----
      darkModeSwitch.addEventListener('click', function() {
        document.body.classList.toggle('dark-mode');
        var isDark = document.body.classList.contains('dark-mode');
        darkModeSwitch.textContent = isDark ? 'Light Mode ☼' : 'Dark Mode ☾';
        darkModeSwitch.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
      });

      // ---- Format toggle (MP3 / MP4) ----
      function updateFormatVisibility() {
        var val = formatSelect.value;
        if (val === '0') {
          mp3Div.style.display = 'block';
          mp4Div.style.display = 'none';
        } else {
          mp3Div.style.display = 'none';
          mp4Div.style.display = 'block';
        }
      }
      formatSelect.addEventListener('change', updateFormatVisibility);

      // ---- Form state helpers ----
      function setState(state) {
        formIdle.classList.remove('is-active');
        formLoading.classList.remove('is-active');
        formResult.classList.remove('is-active');

        if (state === 'idle') {
          formIdle.classList.add('is-active');
        } else if (state === 'loading') {
          formLoading.classList.add('is-active');
        } else if (state === 'result') {
          formResult.classList.add('is-active');
        }
      }

      // ---- Extract YouTube ID from URL ----
      function extractVideoId(input) {
        if (!input) return null;
        input = input.trim();
        // If it's just an ID (11 chars), return as-is
        if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
        // Try various YouTube URL patterns
        var patterns = [
          /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtube\.com\/v\/)([a-zA-Z0-9_-]{11})/,
          /[?&]v=([a-zA-Z0-9_-]{11})/
        ];
        for (var i = 0; i < patterns.length; i++) {
          var m = input.match(patterns[i]);
          if (m) return m[1];
        }
        return null;
      }

      // ---- Build full YouTube URL from ID ----
      function buildUrl(id) {
        return 'https://www.youtube.com/watch?v=' + id;
      }

      // ---- Convert handler ----
      function doConvert() {
        var rawUrl = urlInput.value.trim();
